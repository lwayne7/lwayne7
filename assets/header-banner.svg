<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="45%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#161b26"/>
    </linearGradient>

    <!-- Accent Glow Gradient -->
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.25"/>
    </pattern>

    <!-- Glowing Circles -->
    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Ambient Glow Orbs -->
  <circle cx="180" cy="80" r="140" fill="#38bdf8" fill-opacity="0.12" filter="url(#blurFilter)"/>
  <circle cx="1020" cy="240" r="160" fill="#818cf8" fill-opacity="0.12" filter="url(#blurFilter)"/>
  <circle cx="600" cy="160" r="120" fill="#c084fc" fill-opacity="0.08" filter="url(#blurFilter)"/>

  <!-- Grid Overlay -->
  <rect width="1200" height="320" rx="16" fill="url(#grid)"/>

  <!-- Border Frame -->
  <rect width="1198" height="318" x="1" y="1" rx="15" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.25"/>

  <!-- Top Wave Graphic Ribbon -->
  <path d="M 0 280 C 300 240, 500 310, 800 270 C 950 250, 1100 290, 1200 270 L 1200 320 L 0 320 Z" fill="#0b1120" fill-opacity="0.6"/>
  <path d="M 0 295 C 320 265, 550 320, 850 285 C 1000 270, 1120 300, 1200 290 L 1200 320 L 0 320 Z" fill="#0f172a" fill-opacity="0.8"/>
  <path d="M 0 280 C 300 240, 500 310, 800 270 C 950 250, 1100 290, 1200 270" fill="none" stroke="url(#accentGlow)" stroke-width="2" stroke-opacity="0.7"/>

  <!-- Main Content Text -->
  <g transform="translate(80, 0)">
    <!-- Small Tag -->
    <g transform="translate(0, 55)">
      <rect width="210" height="28" rx="14" fill="url(#badgeGrad)" stroke="#64748b" stroke-width="0.8" stroke-opacity="0.4"/>
      <circle cx="16" cy="14" r="4" fill="#38bdf8"/>
      <text x="28" y="18" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" letter-spacing="1">FULL-STACK &amp; AI ENGINEER</text>
    </g>

    <!-- Name / Main Greeting -->
    <text x="0" y="145" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="-1">
      Hi, I'm <tspan fill="url(#accentGlow)">lwayne</tspan> 👋
    </text>

    <!-- Subtitle / Positioning -->
    <text x="0" y="195" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="400">
      Building high-performance web systems &amp; resilient AI agent workflows.
    </text>

    <!-- Key Chips -->
    <g transform="translate(0, 230)">
      <!-- Chip 1 -->
      <g>
        <rect width="180" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="14" y="20" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500">🎓 Shanghai Univ M.S.</text>
      </g>
      <!-- Chip 2 -->
      <g transform="translate(192, 0)">
        <rect width="186" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="14" y="20" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500">🏢 Ex-China Literature</text>
      </g>
      <!-- Chip 3 -->
      <g transform="translate(390, 0)">
        <rect width="176" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="14" y="20" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500">🚀 2027 Campus Hire</text>
      </g>
    </g>
  </g>

  <!-- Right Decorative Icon / Code Emblem -->
  <g transform="translate(980, 75)" opacity="0.85">
    <rect width="130" height="130" rx="24" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="65" y="82" fill="#38bdf8" font-family="'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="52" font-weight="600" text-anchor="middle">&lt;/&gt;</text>
  </g>
</svg>
